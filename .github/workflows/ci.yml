name: CI Build & Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-node-backend:
    name: Build & Test Node.js PERN API Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd backend
          npm install

      - name: Verify Backend Integrity
        run: |
          cd backend
          npm ls

  build-react-frontend:
    name: Build & Lint React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js (v22 for Vite 8+)
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install Dependencies & Build Distribution
        run: |
          cd frontend
          npm install
          npm run build
