name: CI Build & Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-cpp-backend:
    name: Build & Test C++ Crow API Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install C++ Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake make

      - name: Build C++ Executable
        run: |
          g++ -O2 -std=c++17 backend/src/main.cpp -Ibackend/include -pthread -o backend/url_shortener_server
          chmod +x backend/url_shortener_server

      - name: Verify C++ Build Success
        run: |
          ls -lh backend/url_shortener_server

  build-react-frontend:
    name: Build & Lint React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies & Build Distribution
        run: |
          cd frontend
          npm install
          npm run build
